{% extends "base.html" %}

{% block content %}
<div class="header" style="margin-bottom: 20px;">
    <h1 style="margin: 0;">To-Do List</h1>
    <p style="color: #666; margin: 5px 0;">{{ completed_count }}/{{ total_count }} completed</p>
</div>

<form action="/add" method="POST" style="display: flex; gap: 10px; margin-bottom: 30px;">
    <input type="text" name="title" placeholder="Add a new task..." required>
    <button type="submit">Add</button>
</form>

{% if tasks %}
<div class="card">
    <ul class="task-list">
        {% for task in tasks %}
        <li class="task-item {% if task.done %}done{% endif %}">
            <form action="/toggle/{{ task.id }}" method="POST" style="margin: 0; display: flex; align-items: center;">
                <input type="checkbox" onchange="this.form.submit()" {% if task.done %}checked{% endif %}>
            </form>
            
            <span class="task-title">{{ task.title }}</span>
            
            <form action="/delete/{{ task.id }}" method="POST" style="margin: 0;">
                <button type="submit" class="btn-danger">Delete</button>
            </form>
        </li>
        {% endfor %}
    </ul>
</div>
{% else %}
<div class="card" style="text-align: center; color: #888; padding: 40px 20px;">
    <p>No tasks yet. Create one above!</p>
</div>
{% endif %}
{% endblock %}
