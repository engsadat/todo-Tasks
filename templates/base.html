<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <nav>
            {% if session.get('email') %}
                <a href="/">Tasks</a>
                <a href="/dashboard">Dashboard</a>
                <div class="user-info">
                    {% if session.get('role') == 'admin' %}<span class="admin-badge">Admin</span>{% endif %}
                    <span class="user-email">{{ session.get('email') }}</span>
                    <form action="/logout" method="POST" style="display:inline; margin:0; padding:0;">
                        <button type="submit" class="btn-danger" style="margin-left: 10px;">Logout</button>
                    </form>
                </div>
            {% endif %}
        </nav>
        
        <main>
            {% block content %}{% endblock %}
        </main>

        <footer>
            Powered by Supabase
        </footer>
    </div>
</body>
</html>
